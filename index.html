<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up | Individuals</title>
    <link rel="stylesheet" href="./assets/css/reset.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <main class="wrapper">
      <form name="sign-up" aria-label="sign up">
        <header>
          <img
            class="logo"
            src="./assets/images/Logo-2.svg"
            alt=""
            role="none"
            width="38.67"
            height="40"
          />
          <h1 class="title">For Individuals</h1>
          <p class="text">
            Start benefiting from the wellness experience. For companies looking
            on increasing productivity, and improving organization wellness.
          </p>
        </header>

        <div>
          <section class="form-controls">
            <div class="form-group">
              <label class="label" for="fname">First Name</label>
              <input
                type="text"
                id="fname"
                name="fname"
                class="fname"
                autocomplete="given-name"
                aria-describedby="error-fname"
              />
              <span id="error-fname" class="error" aria-live="polite"></span>
            </div>

            <div class="form-group">
              <label class="label" for="lname">Last Name</label>
              <input
                type="text"
                id="lname"
                name="lname"
                class="lname"
                autocomplete="given-name"
                aria-describedby="error-lname"
              />
              <span id="error-lname" class="error" aria-live="polite"></span>
            </div>

            <div class="form-group">
              <label class="label" for="gender">Gender</label>
              <select
                name="gender"
                id="gender"
                aria-describedby="error-gender"
                class="gender"
              >
                <option value="">Select here</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
              <span id="error-gender" class="error" aria-live="polite"></span>
            </div>

            <div class="form-group">
              <label class="label" for="birth-date">Date of Birth</label>
              <input
                type="date"
                name="birth-date"
                id="birth-date"
                class="birth-date"
                min="2007-01-01"
                aria-describedby="error-birth-date"
              />
              <span class="error" id="error-birth-date"></span>
            </div>
            <div class="form-group">
              <label class="label" for="weight">Weight (KG)</label>
              <input
                type="text"
                id="weight"
                name="weight"
                class="weight"
                inputmode="numeric"
                pattern="\d{0,4}"
                aria-describedby="error-weight"
              />
              <span id="error-weight" class="error" aria-live="polite"></span>
            </div>

            <div class="form-group">
              <label class="label" for="height">Height (CM)</label>
              <input
                type="text"
                id="height"
                name="height"
                class="height"
                inputmode="numeric"
                pattern="\d{0,4}"
                aria-describedby="error-height"
              />
              <span id="error-height" class="error" aria-live="polite"></span>
            </div>

            <div class="form-group form-group-100">
              <label class="label" for="level">Active Level</label>
              <select
                name="level"
                id="level"
                aria-describedby="error-level"
                class="level"
              >
                <option value="">Select here</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
              <span id="error-level" class="error" aria-live="polite"></span>
            </div>

            <div class="form-group form-group-100">
              <label class="label" for="password">Password</label>
              <div class="password-container">
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="password"
                  aria-describedby="error-password"
                />
                <button class="password-visible">
                  <img
                    class="icon"
                    src="./assets/images/show.svg"
                    alt=""
                    role="none"
                  />
                </button>
              </div>
              <span id="error-password" class="error" aria-live="polite"></span>
            </div>

            <div class="form-group">
              <button class="button" type="submit">Register</button>
            </div>
          </section>

          <footer>
            <p>
              By clicking Register, you agree to our
              <a href="#">Terms of Use</a> and our
              <a href="#">Privacy Policy</a>
            </p>
          </footer>
        </div>
      </form>
    </main>
  </body>
</html>
